# Render Blueprint for the ROF LMS API (free plan). Render → New → Blueprint →
# pick this repository. Values marked `sync: false` are asked for once in the
# Render dashboard; they never live in git. Step-by-step: deploy/render/README.md.
#
# The free plan sleeps after ~15 idle minutes and wakes on the next request
# (about a minute). The database is Neon, files go to Cloudflare R2.
# Migrations and the first administrator are applied from a developer machine
# (`npx prisma migrate deploy` / `npx prisma db seed`), not by this service.

services:
  - type: web
    name: rof-lms-api
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS us-east-2 = Render "ohio"): every request
    # makes several database queries, so the API must sit next to the database.
    # If the database is moved to Neon Frankfurt, change this to frankfurt.
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Neon, POOLED connection (host contains -pooler), ending in ?sslmode=require.
      # Migrations and the seed use the direct string instead (deploy/render/README.md §1).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      # The Netlify site's address, e.g. https://roflms.netlify.app (no trailing slash)
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Kigali
      # Proxy hops in front of the API. Render alone = 1. Browsers reach the API through
      # Netlify's /api proxy, so check after go-live (deploy/render/README.md §6) and
      # raise to 2 if everyone shares one rate-limit bucket.
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_UPLOAD_REQUEST_MB
        value: "100"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: WORKERS_ENABLED
        value: "true"
      # Cloudflare R2
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        value: rof-files
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      # E-mail through Resend (docs/EMAIL.md). The key is entered in the Render
      # dashboard only; the sender's domain must be verified in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Rwanda Olympiad Foundation <info@rwandaolympiadfoundation.org>"
      - key: EMAIL_REPLY_TO
        value: info@rwandaolympiadfoundation.org
