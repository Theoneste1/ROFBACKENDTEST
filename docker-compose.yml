# Local development stack:
#
#   docker compose up -d            # Postgres, S3Mock, migrations, API
#   open http://localhost:3000/api/docs   (Swagger)
#
# Uploaded files go to S3Mock (adobe/s3mock), a local S3-compatible server:
# bucket "rof-files", any credentials, listing at http://localhost:9090/rof-files
#
# E-mails are logged by the API (dry run). To really send them through Resend,
# export RESEND_API_KEY and EMAIL_REDIRECT_TO (your own inbox) before
# `docker compose up` — see docs/EMAIL.md.
#
# For production use managed PostgreSQL + object storage + Resend;
# see docs/DEPLOYMENT.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rof
      POSTGRES_PASSWORD: rof
      POSTGRES_DB: rof
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rof -d rof"]
      interval: 5s
      retries: 10

  # MinIO's public images were withdrawn; S3Mock provides the S3 API locally.
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: rof-files
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["9090:9090"]
    volumes: [s3data:/s3mockroot]

  migrate:
    build: { context: ., target: migrate }
    environment: &api-env
      NODE_ENV: development
      DATABASE_URL: postgresql://rof:rof@postgres:5432/rof?schema=public
      JWT_SECRET: local-development-secret-change-me-0123456789
      APP_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      STORAGE_DRIVER: s3
      S3_BUCKET: rof-files
      S3_ENDPOINT: http://s3mock:9090
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: rof
      S3_SECRET_ACCESS_KEY: rof-local-dummy-secret
      S3_FORCE_PATH_STYLE: "true"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_REDIRECT_TO: ${EMAIL_REDIRECT_TO:-}
      EMAIL_FROM: "Rwanda Olympiad Foundation <info@rwandaolympiadfoundation.org>"
      SEED_ADMIN_PASSWORD: Admin12345
      SEED_DEMO: "true"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: runtime }
    environment:
      <<: *api-env
      SWAGGER_ENABLED: "true"
    ports: ["3000:3000"]
    depends_on:
      migrate:    { condition: service_completed_successfully }
      s3mock:     { condition: service_started }

volumes:
  pgdata:
  s3data:
