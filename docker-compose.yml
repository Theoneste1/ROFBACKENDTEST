# Local development stack:
#
#   docker compose up -d            # Postgres, Mailpit, MinIO, migrations, API
#   open http://localhost:3000/api/docs   (Swagger)
#   open http://localhost:8025            (Mailpit — every e-mail the API sends)
#   open http://localhost:9001            (MinIO console, rof / rof-minio-secret)
#
# For production use managed PostgreSQL + object storage + a real SMTP provider;
# see docs/DEPLOYMENT.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rof
      POSTGRES_PASSWORD: rof
      POSTGRES_DB: rof
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rof -d rof"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rof
      MINIO_ROOT_PASSWORD: rof-minio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 rof rof-minio-secret; do sleep 1; done;
             mc mb --ignore-existing local/rof-files"

  migrate:
    build: { context: ., target: migrate }
    environment: &api-env
      NODE_ENV: development
      DATABASE_URL: postgresql://rof:rof@postgres:5432/rof?schema=public
      JWT_SECRET: local-development-secret-change-me-0123456789
      APP_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      STORAGE_DRIVER: s3
      S3_BUCKET: rof-files
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: rof
      S3_SECRET_ACCESS_KEY: rof-minio-secret
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: "ROF Learning <noreply@rof.local>"
      SEED_ADMIN_PASSWORD: Admin12345
      SEED_DEMO: "true"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: runtime }
    environment:
      <<: *api-env
      SWAGGER_ENABLED: "true"
    ports: ["3000:3000"]
    depends_on:
      migrate:    { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      mailpit:    { condition: service_started }

volumes:
  pgdata:
  miniodata:
