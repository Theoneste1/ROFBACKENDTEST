name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rof
          POSTGRES_PASSWORD: rof
          POSTGRES_DB: rof_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rof -d rof_ci"
          --health-interval 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://rof:rof@localhost:5432/rof_ci?schema=public
      TEST_DATABASE_URL: postgresql://rof:rof@localhost:5432/rof_ci?schema=public&application_name=e2e
      JWT_SECRET: ci-only-secret-that-is-long-enough-0123456789
      # An S3-compatible server for test/s3-storage.e2e-spec.ts (started below).
      # S3Mock accepts any credentials; these are dummies.
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_ACCESS_KEY: rof-ci
      S3_TEST_SECRET_KEY: rof-ci-dummy-secret
      S3_TEST_BUCKET: rof-e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Proves the migration history builds an empty database from scratch.
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy

      # Fails if schema.prisma was changed without a migration.
      - name: Check for schema drift
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # MinIO's public Docker images were withdrawn (pulls are denied), so the
      # S3 API is provided by Adobe S3Mock, a server made for testing S3 clients.
      - name: Start S3Mock (S3-compatible storage for the S3 driver test)
        run: |
          docker run -d --name s3mock -p 9000:9090 adobe/s3mock:5.2.3
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:9000/favicon.ico && exit 0; sleep 1; done
          docker logs s3mock; echo "S3Mock did not start"; exit 1

      - name: End-to-end tests (incl. e-mail through the Resend SDK, and S3)
        run: npm run test:e2e

      - name: Build
        run: npm run build

      # The OpenAPI file, Postman collection, API reference and authorization
      # matrix are generated from the code; fail if they were not regenerated.
      - name: API documentation is up to date
        run: node scripts/generate-api-docs.mjs && git diff --exit-code -- docs/api docs/API.md docs/AUTHORIZATION.md

      - name: Every API route has an end-to-end test
        run: npm run test:routes

      # The API contract must equal the latest approved snapshot, and each step in
      # docs/baseline must contain exactly its approved changes (no breaking or
      # review changes). Runs after the docs check, so openapi.json is current.
      - name: API contract snapshot tests
        run: node --test scripts/api-snapshot.test.mjs

      - name: Build Docker image
        run: docker build --target runtime -t rof-api:ci .

  # The full docker-compose stack (Postgres, S3Mock, migrate + seed,
  # API) comes up and serves a real request flow.
  compose-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300 api
      - name: Smoke test
        run: |
          echo "1/4 health: database and storage up"
          curl -fsS http://localhost:3000/health | grep '"database":"up"' | grep '"storage":"up"'
          echo "2/4 admin login"
          TOKEN=$(curl -fsS -X POST http://localhost:3000/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"username":"admin","password":"Admin12345"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).access_token')
          echo "3/4 admin dashboard"
          curl -fsS http://localhost:3000/api/v1/admin/dashboard -H "Authorization: Bearer $TOKEN" > /dev/null
          echo "4/4 OpenAPI document lists every operation (200+; several share a path)"
          curl -fsS http://localhost:3000/api/docs-json | node -e '
            const d = JSON.parse(require("fs").readFileSync(0));
            const ops = Object.values(d.paths).flatMap((p) => Object.keys(p).filter((m) => ["get", "post", "put", "patch", "delete"].includes(m)));
            console.log(`${ops.length} operations`);
            if (ops.length < 200) process.exit(1);'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
